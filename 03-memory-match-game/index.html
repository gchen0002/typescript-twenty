<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A classic memory matching card game built with TypeScript" />
    <title>Memory Match Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/style.css" />
</head>

<body>
    <div class="app">
        <!-- Header -->
        <header class="header">
            <h1 class="title">🧠 Memory Match</h1>
            <p class="subtitle">Find all the matching pairs!</p>
        </header>

        <!-- Stats Bar -->
        <div class="stats-bar">
            <div class="stat">
                <span class="stat-label">Moves</span>
                <span class="stat-value" id="moves-count">0</span>
            </div>
            <div class="stat">
                <span class="stat-label">Pairs Found</span>
                <span class="stat-value" id="pairs-count">0 / 8</span>
            </div>
            <div class="stat">
                <span class="stat-label">Time</span>
                <span class="stat-value" id="timer-display">0:00</span>
            </div>
            <div class="stat">
                <span class="stat-label">Best Score</span>
                <span class="stat-value" id="best-time-display">--:--</span>
            </div>
            <button class="btn-reset" id="reset-btn">🔄 New Game</button>
        </div>

        <!-- Game Board -->
        <div class="game-board" id="game-board">
            <!-- Cards will be generated by TypeScript -->
            <!-- Example card structure (for reference):
        <div class="card" data-card-id="0">
          <div class="card-inner">
            <div class="card-front">❓</div>
            <div class="card-back">🎮</div>
          </div>
        </div>
        -->
        </div>

        <!-- Win Message -->
        <div class="win-message hidden" id="win-message">
            <div class="win-content">
                <h2>🎉 Congratulations!</h2>
                <p>You matched all pairs in <span id="final-moves">0</span> moves!</p>
                <button class="btn-play-again" id="play-again-btn">Play Again</button>
            </div>
        </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
</body>

</html>
