<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart To-Do List</title>
</head>

<body>
  <div id="app">
    <h1>Smart To-Do List</h1>

    <div class="input-group">
      <input type="text" id="taskInput" placeholder="What needs to be done?" autofocus />
      <select id="prioritySelect">
        <option value="high">High Priority</option>
        <option value="medium" selected>Medium Priority</option>
        <option value="low">Low Priority</option>
      </select>
      <input type="date" id="dueDateInput">
      <button id="addBtn">Add Task</button>
    </div>

    <div class="filters">
      <button id="filterAll" class="filter-btn active" data-filter="all">All</button>
      <button id="filterActive" class="filter-btn" data-filter="active">Active</button>
      <button id="filterCompleted" class="filter-btn" data-filter="completed">Completed</button>
      <button id="filterTimed" class="filter-btn" data-filter="timed">Timed</button>
      <button id="filterUntimed" class="filter-btn" data-filter="untimed">Untimed</button>
      <button id="clearAllCompleted" class="clear-completed-btn">Clear All Completed </button>
    </div>

    <div class="stats">
      <span id="taskCount">0 tasks</span>
      <span id="activeCount">0 active</span>
      <span id="completedCount">0 completed</span>
    </div>
    <ul id="taskList">
      <!-- Tasks will be injected here -->
    </ul>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
